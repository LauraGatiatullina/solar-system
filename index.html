<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Солнечная система — полёт между планетами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500&display=swap">
<style>
:root {
  --bg:#03050A; --panel:rgba(9,13,22,.76); --line:rgba(255,255,255,.10); --text:#EAF0F9; --muted:#8F9CB4; --acc:#4C8DFF;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#03050A; --panel:rgba(9,13,22,.76); --line:rgba(255,255,255,.10); --text:#EAF0F9; --muted:#8F9CB4; } }
:root[data-theme="dark"] { --bg:#03050A; --panel:rgba(9,13,22,.76); --line:rgba(255,255,255,.10); --text:#EAF0F9; --muted:#8F9CB4; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 400 14px/1.45 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 0; background: none; color: rgba(255,255,255,.88); font-size: 12.5px; font-weight: 500; text-shadow: 0 0 6px #000, 0 0 2px #000; white-space: nowrap; }
.tag i { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(0,0,0,.5); }
.tag.dot i { display: inline-block; }

.top { position: fixed; z-index: 5; left: 10px; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.bar { pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.bar button { white-space: nowrap; min-width: 38px; height: 38px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; font-size: 13px; }
.bar button:hover { background: rgba(255,255,255,.07); }
.bar button.off { opacity: .4; }
.bar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
#t-play .pl { display: none; } #t-play.paused .pl { display: inline; } #t-play.paused .pa { display: none; }
#t-date { padding: 0 8px 0 4px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.bar.time { position: relative; }
@media (max-width: 640px) { #t-date { position: absolute; left: 6px; top: calc(100% + 6px); padding: 0; text-shadow: 0 0 6px #000, 0 0 2px #000; } }
@media (min-width: 641px) { #flight, #hint { top: calc(env(safe-area-inset-top, 0px) + 66px); } }

#flight { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; align-items: baseline; padding: 8px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 12.5px; white-space: nowrap; max-width: calc(100vw - 20px); }
#flight[hidden] { display: none; }
#flight b { font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 13px; }
#flight span small { color: var(--muted); margin-right: 5px; }

#dock { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; padding: 0 0 env(safe-area-inset-bottom, 0px); display: flex; flex-direction: column; pointer-events: none; }
#dock > * { pointer-events: auto; }
#info { margin: 0 8px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 0 16px 10px; border-top: 2px solid var(--acc); }
.grab { display: block; width: 100%; height: 22px; border: 0; background: none; padding: 0; }
.grab span { display: block; width: 38px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.28); margin: 9px auto 0; }
.head { cursor: pointer; }
.head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.head h2 { margin: 1px 0 2px; font: 500 22px/1.15 'Unbounded', sans-serif; letter-spacing: -.01em; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.quick div { min-width: 0; }
.quick b { display: block; font-weight: 600; font-size: 12.5px; line-height: 1.25; }
.quick small { color: var(--muted); font-size: 11.5px; }
.more { display: none; margin-top: 12px; max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 2px; }
#info.open .more { display: block; }
#info.open .quick { display: none; }
.live { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 12px; margin-bottom: 12px; border-radius: 12px; background: rgba(255,255,255,.05); }
.live div { display: flex; justify-content: space-between; gap: 10px; }
.live small { color: var(--muted); font-size: 12.5px; } .live b { font-weight: 600; font-size: 12.5px; text-align: right; }
dl { margin: 0; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); gap: 7px 12px; }
dt { color: var(--muted); font-size: 12.5px; } dd { margin: 0; font-weight: 500; font-size: 13px; }
.more h3 { margin: 18px 0 8px; font: 500 13px 'Unbounded', sans-serif; }
.more ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.more li { padding-left: 12px; border-left: 2px solid var(--acc); font-size: 13.5px; line-height: 1.5; }

#chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 8px 8px; background: rgba(5,8,14,.9); border-top: 1px solid var(--line); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px 0 11px; border-radius: 19px; border: 1px solid var(--line); background: rgba(255,255,255,.04); font-weight: 500; font-size: 13.5px; }
.chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
.chip.on { border-color: var(--c); background: rgba(255,255,255,.10); }

#hint { position: fixed; z-index: 6; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 84px); transform: translate(-50%, -8px); opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; padding: 9px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 13px; text-align: center; width: max-content; max-width: calc(100vw - 24px); }
#hint.show { opacity: 1; transform: translate(-50%, 0); }
#loader { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-content: center; text-align: center; gap: 14px; transition: opacity .7s; }
#loader.done { opacity: 0; pointer-events: none; }
#loader h1 { margin: 0; font: 500 20px 'Unbounded', sans-serif; }
#loadmsg { color: var(--muted); }
#loader .bar2 { width: 160px; height: 2px; margin: 0 auto; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
#loader .bar2::after { content: ''; display: block; width: 40%; height: 100%; background: #fff; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { #loader .bar2::after { animation: none; width: 100%; } #hint { transition: none; } }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

@media (min-width: 900px) {
  #dock { left: 16px; right: auto; top: 76px; bottom: 16px; width: 360px; flex-direction: column; }
  #chips { order: -1; flex-wrap: wrap; overflow: visible; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); margin-bottom: 8px; padding: 8px; }
  #info { flex: 1 1 auto; min-height: 0; margin: 0; border-bottom: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; }
  .grab { display: none; } .head { cursor: default; padding-top: 14px; }
  .quick { display: none; }
  .more, #info.open .more { display: block; flex: 1 1 auto; max-height: none; min-height: 0; }
  #info .more { display: block; }
}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D-модель Солнечной системы. Перетаскивай, чтобы вращать, щипок или колёсико — масштаб."></canvas>
<div id="labels"></div>

<div class="top">
  <div class="bar time">
    <button id="t-play" type="button" aria-label="Пауза"><svg class="pa" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><svg class="pl" viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg></button>
    <button id="t-speed" type="button" aria-label="Скорость времени"></button>
    <button id="t-now" type="button">Сейчас</button>
    <span id="t-date"></span>
  </div>
  <div class="bar">
    <button id="b-orbits" type="button" aria-label="Показать орбиты"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="5.5" transform="rotate(-20 12 12)"/><circle cx="12" cy="12" r="1.6"/></svg></button>
    <button id="b-labels" type="button" aria-label="Показать подписи">Аа</button>
  </div>
</div>

<div id="flight" hidden><b>Перелёт: <span id="fl-to"></span></b><span><small>Скорость</small><span id="fl-speed"></span></span><span><small>Осталось</small><span id="fl-left"></span></span></div>
<div id="hint">Тяни, чтобы вращать · щипок — масштаб · выбери планету внизу, чтобы лететь к ней</div>

<div id="dock">
  <section id="info">
    <button id="info-toggle" class="grab" type="button" aria-label="Показать подробности" aria-expanded="false"><span></span></button>
    <div id="i-head" class="head"><p id="i-kind"></p><h2 id="i-name"></h2><p id="i-tag"></p></div>
    <div id="i-quick" class="quick"></div>
    <div id="info-scroll" class="more">
      <div id="i-live" class="live"></div>
      <dl id="i-stats"></dl>
      <h3>Интересные факты</h3>
      <ul id="i-facts"></ul>
    </div>
  </section>
  <div id="chips" role="toolbar" aria-label="Куда лететь"></div>
</div>

<div id="loader"><h1>Солнечная система</h1><div class="bar2"></div><div id="loadmsg">Готовим космос…</div></div>

/* ===== GLSL sources shared by the app and the test harness (WebGL1-style GLSL, three.js r128 compatible) ===== */
function fbmSrc(name, n, norm) {
  return 'float ' + name + '(vec3 p){ float s=0.0; float a=0.5; for(int i=0;i<' + n + ';i++){ s+=a*vnoise(p); p=M3*p*2.03; a*=0.5; } return s*' + norm + '; }\n';
}
var GLSL_NOISE = [
  'const float PI = 3.14159265359;',
  'const mat3 M3 = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);',
  'float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx+31.32); return fract((p.x+p.y)*p.z); }',
  'vec3 hash33(vec3 p){ p = fract(p*vec3(0.1031,0.1030,0.0973)); p += dot(p, p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }',
  'float vnoise(vec3 x){',
  '  vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);',
  '  float a=hash13(i); float b=hash13(i+vec3(1.0,0.0,0.0)); float c=hash13(i+vec3(0.0,1.0,0.0)); float d=hash13(i+vec3(1.0,1.0,0.0));',
  '  float e=hash13(i+vec3(0.0,0.0,1.0)); float g=hash13(i+vec3(1.0,0.0,1.0)); float h=hash13(i+vec3(0.0,1.0,1.0)); float k=hash13(i+vec3(1.0,1.0,1.0));',
  '  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(e,g,f.x),mix(h,k,f.x),f.y), f.z);',
  '}',
  fbmSrc('fbm3', 3, '1.142857'), fbmSrc('fbm4', 4, '1.066667'), fbmSrc('fbm5', 5, '1.032258'), fbmSrc('fbm6', 6, '1.015873'),
  'vec2 lonlat(vec3 p){ return vec2(atan(-p.z,p.x)/(2.0*PI)+0.5, asin(clamp(p.y,-1.0,1.0))/PI+0.5); }',
  'float wrapPi(float a){ return a - 6.2831853*floor((a+3.14159265)/6.2831853); }'
].join('\n');

var GLSL_RING_PROFILE = [
  'float ringOpacity(float r){',
  '  float o = 0.0;',
  '  o += smoothstep(1.24,1.30,r)*(1.0-smoothstep(1.50,1.53,r))*0.20;',
  '  o += smoothstep(1.52,1.57,r)*(1.0-smoothstep(1.93,1.96,r))*0.86;',
  '  o += smoothstep(2.02,2.05,r)*(1.0-smoothstep(2.26,2.28,r))*0.58;',
  '  float f = 0.70 + 0.30*sin(r*210.0)*sin(r*61.0+1.3) + 0.12*sin(r*520.0);',

var GLSL_BODY_VARY = [
  'varying vec3 vObj;', 'varying vec3 vN;', 'varying vec3 vV;', 'varying vec3 vSunV;', 'varying vec3 vSunObj;'

var VS_BODY = GLSL_BODY_VARY + '\n' + [
  'uniform vec3 uSunW;',
  'void main(){',
  '  vObj = position;',
  '  vN = normalize(normalMatrix * normal);',
  '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',

  '  vec3 N = normalize(vN); vec3 V = normalize(vV); vec3 L = normalize(vSunV);',

  '  float depth = -(1.0-d*d)*inside*0.9;',
  '  float g = (d-1.0)/0.22;',
  '  float rim = 0.55*exp(-g*g);',
  '  return has*(depth+rim)*(0.6+0.8*rad/0.30);',
  '}',
  'float rockyHeight(vec3 p){',
  '  float h = fbm5(p*3.0)*0.35;',
  '  vec3 q = p;',
  '  float c = craterLayer(q, 3.0, 0.55, 1.0);',
  '  q = M3*q; c += craterLayer(q, 7.0, 0.60, 2.0)*0.55;',
  '  q = M3*q; c += craterLayer(q, 16.0, 0.65, 3.0)*0.25;',
  '  q = M3*q; c += craterLayer(q, 37.0, 0.70, 4.0)*0.11;',
  '  q = M3*q; c += craterLayer(q, 85.0, 0.75, 5.0)*0.05;',
  '  return h + c*uCrater;',
  '}',
  'float featureMask(vec3 p){',
  '  float lat = asin(clamp(p.y,-1.0,1.0)); float lon = atan(-p.z, p.x);',
  '  float m = 0.0;',
  '  for(int i=0;i<12;i++){',
  '    vec4 f = uFeat[i];',
  '    if(f.z > 0.0){',
  '      float dl = wrapPi(lon - f.y);',
  '      vec2 d = vec2(dl*cos(lat), lat - f.x);',
  '      float r = length(d)/f.z;',
  '      if(r < 1.7){',
  '        float n = fbm3(p*9.0 + float(i)*3.1) - 0.5;',
  '        m += smoothstep(1.0, 0.55, r + n*0.9)*f.w;',
  '      }',
  '    }',
  '  }',
  '  return m;',
  '}',
  'void main(){',
  PRO,
  '  float h0 = rockyHeight(p);',
  '  float h1 = rockyHeight(normalize(p + Lt*0.0025));',
  '  float slope = (h0-h1)/0.0025;',
  '  float albN = fbm5(p*5.0+2.0); float lowF = fbm3(p*1.7+9.0);',
  '  vec3 base = mix(uColLow, uColHigh, smoothstep(0.30, 0.70, albN*0.7+lowF*0.3));',
  '  float fm = featureMask(p);',
  '  base = mix(base, uColDark, clamp(fm,0.0,1.0));',
  '  base = mix(base, min(base*1.7+0.06, vec3(1.0)), clamp(-fm,0.0,1.0));',
  '  base *= 0.86 + 0.22*clamp(h0*0.7+0.5, 0.0, 1.0);',
  '  float cap = uCap*smoothstep(0.972, 0.985, abs(p.y) + (fbm4(p*8.0)-0.5)*0.03);',
  '  base = mix(base, vec3(0.92,0.94,0.96), cap);',
  '  float ndlB = ndl + slope*uBump;',
  '  float diff = pow(clamp(ndlB, 0.0, 1.0), 0.7) * smoothstep(-0.03, 0.10, ndl);',
  '  float rim = pow(1.0-nv, 4.0);',
  '  vec3 col = base*(diff*uSunI + 0.012);',
  '  col += uAtmCol*uAtmAmt*rim*smoothstep(-0.2, 0.6, ndl);',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

/* ---------- Earth ---------- */
var GLSL_CLOUD = [
  'uniform float uCloudRot;',
  'float cloudDensity(vec3 p){',
  '  float c = cos(uCloudRot); float s = sin(uCloudRot);',
  '  vec3 q = vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z);',
  '  vec3 w = vec3(fbm3(q*2.5), fbm3(q*2.5+5.2), fbm3(q*2.5+9.1)) - 0.5;',
  '  float n = fbm6(q*3.4 + w*1.7);',
  '  float lat = abs(q.y);',
  '  float g1 = lat/0.16; float g2 = (lat-0.47)/0.16; float g3 = (lat-0.80)/0.13;',
  '  float dc = 0.12*exp(-g1*g1) - 0.15*exp(-g2*g2) + 0.12*exp(-g3*g3);',
  '  return smoothstep(0.52-dc, 0.77-dc, n);',
  '}'
].join('\n');

var FS_EARTH = GLSL_FRAG_HEAD + [
  'uniform sampler2D uMapA; uniform sampler2D uMapB;',
  GLSL_CLOUD,
  'float terrainH(vec3 p){ vec2 uv = lonlat(p); return texture2D(uMapB, uv).g*(0.45+1.1*fbm5(p*60.0)); }',
  'void main(){',
  PRO,
  '  vec3 w = vec3(vnoise(p*14.0), vnoise(p*14.0+5.3), vnoise(p*14.0+11.7)) - 0.5;',
  '  vec3 pw = normalize(p + w*0.018);',
  '  vec2 uv = lonlat(pw);',
  '  vec3 A = texture2D(uMapA, uv).rgb; vec3 B = texture2D(uMapB, uv).rgb;',
  '  float fr = fbm5(p*38.0) - 0.5;',
  '  float edge = 1.0 - abs(A.r*2.0-1.0);',
  '  float land = smoothstep(0.46, 0.54, A.r + fr*0.55*edge);',
  '  float latS = abs(p.y);',
  '  float ele = B.g*(0.45+1.1*fbm5(p*60.0));',
  '  float vari = fbm5(p*22.0);',
  '  vec3 lc = mix(vec3(0.40,0.40,0.20), vec3(0.22,0.33,0.12), smoothstep(0.35, 0.70, vari + A.b*0.3));',
  '  lc = mix(lc, vec3(0.05,0.17,0.06), clamp(A.b*1.3, 0.0, 1.0));',
  '  lc = mix(lc, vec3(0.66,0.52,0.33)*(0.85+0.3*vari), clamp(A.g*1.4, 0.0, 1.0));',
  '  lc = mix(lc, vec3(0.09,0.16,0.11), smoothstep(0.80,0.88,latS)*(1.0-A.g));',
  '  lc = mix(lc, vec3(0.36,0.37,0.31), smoothstep(0.92,0.96,latS));',
  '  lc = mix(lc, vec3(0.40,0.35,0.30), smoothstep(0.18, 0.55, ele)*0.8);',
  '  lc *= 0.82 + 0.36*fbm4(p*90.0);',
  '  float snow = smoothstep(0.80, 1.20, ele)*(1.0-A.g*0.7);',
  '  lc = mix(lc, vec3(0.93,0.95,0.97), clamp(B.r + snow, 0.0, 1.0));',
  '  float shallow = smoothstep(0.02, 0.60, B.b);',
  '  vec3 oc = mix(vec3(0.012,0.06,0.18), vec3(0.04,0.24,0.34), shallow*shallow);',
  '  oc *= 0.9 + 0.2*fbm3(p*50.0);',
  '  float iceO = clamp(B.r*1.1 + (fbm4(p*20.0)-0.5)*0.25*step(0.01, B.r), 0.0, 1.0);',
  '  oc = mix(oc, vec3(0.88,0.93,0.97), iceO);',
  '  vec3 surf = mix(oc, lc, land);',
  '  float sh = cloudDensity(normalize(p + Lt*0.012));',
  '  surf *= 1.0 - 0.45*sh;',
  '  float h0 = terrainH(p); float h1 = terrainH(normalize(p + Lt*0.003));',
  '  float ndlB = ndl + land*(h0-h1)/0.003*0.010;',
  '  float diff = pow(clamp(ndlB,0.0,1.0), 0.85) * smoothstep(-0.05, 0.08, ndl);',
  '  vec3 R = reflect(-L, N);',
  '  float spec = pow(max(dot(R, V), 0.0), 90.0)*(1.0-land)*(1.0-iceO)*smoothstep(0.0, 0.2, ndl)*0.75;',
  '  float night = smoothstep(0.10, -0.12, ndl);',
  '  float popMask = land*(1.0-B.r)*(1.0-A.g*0.85)*smoothstep(0.93, 0.75, latS);',
  '  float n1 = fbm4(p*9.0+3.0); float n2 = fbm5(p*42.0);',
  '  float lights = smoothstep(0.58,0.80,n1)*smoothstep(0.50,0.75,n2) + 0.4*smoothstep(0.70,0.85,fbm4(p*95.0))*smoothstep(0.55,0.75,n1);',
  '  vec3 city = vec3(1.0,0.72,0.38)*1.5*lights*popMask*night;',
  '  float rim = pow(1.0-nv, 3.0);',
  '  float day = smoothstep(-0.10, 0.40, ndl);',
  '  vec3 sky = mix(vec3(1.0,0.45,0.2), vec3(0.20,0.45,1.0), smoothstep(0.0, 0.30, ndl+0.05));',
  '  vec3 col = surf*(diff*uSunI + 0.005) + vec3(0.9,0.95,1.0)*spec + city;',
  '  col += sky*rim*day*0.85;',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

var FS_CLOUDS = GLSL_FRAG_HEAD + GLSL_CLOUD + '\n' + [
  'void main(){',
  PRO,
  '  float d = cloudDensity(p);',
  '  float lit = smoothstep(-0.12, 0.45, ndl);',

/* ---------- Venus ---------- */
var FS_VENUS = GLSL_FRAG_HEAD + [

/* ---------- Jupiter ---------- */
var FS_JUPITER = GLSL_FRAG_HEAD + [

/* ---------- Saturn ---------- */
var FS_SATURN = GLSL_FRAG_HEAD + GLSL_RING_PROFILE + '\n' + [
  'void main(){',
  PRO,
  '  float lat = asin(clamp(p.y,-1.0,1.0)); float lon = atan(-p.z, p.x);',
  '  float t1 = fbm5(vec3(p.x*4.0, p.y*20.0, p.z*4.0));',
  '  float t2 = fbm4(vec3(p.x*10.0, p.y*45.0, p.z*10.0) + 4.0);',
  '  float yy = p.y + (t1-0.5)*0.04;',
  '  float s = 0.5 + 0.5*(0.6*sin(yy*17.0 + 0.9*sin(yy*6.1)) + 0.4*sin(yy*38.0 + 1.7));',
  '  vec3 base = mix(vec3(0.74,0.62,0.42), vec3(0.92,0.84,0.64), smoothstep(0.25, 0.75, s*0.8 + t2*0.35));',
  '  base *= 0.95 + 0.10*t1;',
  '  float pol = acos(clamp(p.y,-1.0,1.0));',
  '  float hexR = 0.262 + 0.020*cos(6.0*lon);',
  '  float hexLine = smoothstep(0.012, 0.0, abs(pol-hexR));',
  '  base = mix(base, vec3(0.42,0.50,0.52), smoothstep(hexR, hexR-0.07, pol)*0.55 + hexLine*0.20);',
  '  base = mix(base, vec3(0.70,0.62,0.50), smoothstep(0.88, 0.99, -p.y)*0.35);',

  '  float ringSh = 0.0;',
  '  if(abs(Lo.y) > 0.01){',

  '  }',
  '  base *= 0.50 + 0.50*pow(nv, 0.45);',
  '  float diff = pow(clamp((ndl+0.06)/1.06, 0.0, 1.0), 0.9)*(1.0 - 0.85*ringSh);',
  '  vec3 col = base*(diff*uSunI + 0.004);',
  '  col += vec3(0.9,0.8,0.6)*pow(1.0-nv, 4.0)*0.15*smoothstep(-0.2, 0.5, ndl);',

].join('\n');

var VS_RING = [

var FS_RING = 'varying vec3 vPos;\nvarying vec3 vSunObj;\nuniform float uSunI;\n' + GLSL_RING_PROFILE + '\n' + [

  '}'

/* ---------- Uranus / Neptune ---------- */
var FS_ICE = GLSL_FRAG_HEAD + [

].join('\n');

/* ---------- Atmosphere halo shell (rendered on back faces, additive) ---------- */
var FS_ATMO = GLSL_BODY_VARY + '\n' + [

/* ---------- Sun ---------- */
var FS_SUN = GLSL_BODY_VARY + '\nuniform float uTime;\n' + GLSL_NOISE + '\n' + [

var FS_SKY = 'varying vec3 vDir;\nuniform vec3 uGalPole; uniform vec3 uGalCenter;\n' + GLSL_NOISE + '\n' + [

  d.stats.slice(0, 3).forEach(function (s) { var e = document.createElement('div'); e.innerHTML = '<b></b><small></small>'; e.firstChild.textContent = s[1]; e.lastChild.textContent = s[0]; q.appendChild(e); });

  d.stats.forEach(function (s) { var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = s[0]; dd.textContent = s[1]; st.appendChild(dt); st.appendChild(dd); });
  var fl = $('i-facts'); fl.innerHTML = '';
  d.facts.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; fl.appendChild(li); });
  $('info-scroll').scrollTop = 0;
}
var liveT = 0;
function updateLive(now) {
  if (now - liveT < 250) return; liveT = now;
  var b = bodies[S.target], rows = [];
  if (S.target !== 'sun') { var ds = b.pos.length() / KM; rows.push(['До Солнца сейчас', fmtKm(ds) + ' · ' + (ds / 149597870.7).toFixed(3).replace('.', ',') + ' а.е.']); }
  if (S.target !== 'earth') { var de = b.pos.distanceTo(bodies.earth.pos) / KM; rows.push(['До Земли сейчас', fmtKm(de)]); rows.push(['Свет идёт до Земли', fmtLight(de / C_KMS)]); }
  else { var dm = bodies.moon.pos.distanceTo(b.pos) / KM; rows.push(['До Луны сейчас', fmtKm(dm)]); rows.push(['Свет от Солнца идёт', fmtLight(b.pos.length() / KM / C_KMS)]); }
  var html = ''; rows.forEach(function (r) { html += '<div><small>' + r[0] + '</small><b>' + r[1] + '</b></div>'; });
  $('i-live').innerHTML = html;
  $('t-date').textContent = new Date(S.sim).toLocaleString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
var sheetOpen = false;
function setSheet(o) { sheetOpen = o; $('info').classList.toggle('open', o); $('info-toggle').setAttribute('aria-expanded', String(o)); }
$('info-toggle').addEventListener('click', function () { setSheet(!sheetOpen); });
$('i-head').addEventListener('click', function () { setSheet(!sheetOpen); });
function closeSheetOnFlight() { if (window.innerWidth < 900) setSheet(false); }

$('t-play').addEventListener('click', function () { S.paused = !S.paused; this.classList.toggle('paused', S.paused); this.setAttribute('aria-label', S.paused ? 'Продолжить время' : 'Пауза'); });
$('t-speed').addEventListener('click', function () { S.speed = (S.speed + 1) % SPEEDS.length; this.textContent = SPEEDS[S.speed].t; });
$('t-now').addEventListener('click', function () { S.sim = Date.now(); });
$('b-orbits').addEventListener('click', function () { S.orbits = !S.orbits; this.classList.toggle('off', !S.orbits); });
$('b-labels').addEventListener('click', function () { S.labels = !S.labels; this.classList.toggle('off', !S.labels); $('labels').style.display = S.labels ? '' : 'none'; });
$('t-speed').textContent = SPEEDS[S.speed].t;

/* подписи на сцене */
var labelsEl = $('labels'), labelObjs = [];
ORDER.forEach(function (id) {
  var el = document.createElement('button'); el.type = 'button'; el.className = 'tag'; el.style.setProperty('--c', BY[id].color);
  el.innerHTML = '<i></i><span>' + BY[id].name + '</span>'; el.addEventListener('click', function () { flyTo(id); });
  labelsEl.appendChild(el); labelObjs.push({ id: id, el: el });
});
var pv = new V3();
function updateLabels() {
  var focal = H / (2 * Math.tan(camera.fov * RAD / 2));
  var fwd = new V3(0, 0, -1).applyQuaternion(camera.quaternion);
  for (var i = 0; i < labelObjs.length; i++) {
    var o = labelObjs[i], b = bodies[o.id];
    pv.copy(b.pos).sub(camera.position);
    var dist = pv.length(), front = pv.dot(fwd) > 0;
    var sr = b.R / dist * focal;
    var show = front && S.labels && sr < H * 0.22;
    if (o.id === 'moon' && S.focus !== 'moon' && camera.position.distanceTo(bodies.earth.pos) > 1500) show = false;
    if (o.id === S.focus && sr > 40 && !S.flight) show = false;
    if (show) {
      pv.copy(b.pos).project(camera);
      var x = (pv.x * 0.5 + 0.5) * W, y = (-pv.y * 0.5 + 0.5) * H;
      if (x < -50 || x > W + 50 || y < -50 || y > H + 50) show = false;
      else { o.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + (y + Math.max(8, sr + 6)).toFixed(1) + 'px) translate(-50%,0)'; o.el.classList.toggle('dot', sr < 7); }
    }
    o.el.style.display = show ? '' : 'none';
  }
}

/* ---------------- размер, цикл ---------------- */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

var last = performance.now(), ema = 16, slow = 0, started = false, frames = 0;
function frame(now) {
  var dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!S.paused) S.sim += dt * 1000 * SPEEDS[S.speed].k;
  updateBodies(); updateCamera(dt, now); updateLabels(); updateLive(now);
  window.__starMat.uniforms.uPx.value = pixelRatio;
  renderer.render(scene, camera);
  frames++;
  if (frames === 3 && !started) { started = true; $('loader').classList.add('done'); setTimeout(function () { $('loader').remove(); }, 800); showHint(); }
  ema += (dt * 1000 - ema) * 0.05;
  if (frames > 90 && ema > 34 && pixelRatio > 1) { slow++; if (slow > 40) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); slow = 0; ema = 16; } } else slow = 0;
  requestAnimationFrame(frame);
}
function showHint() { var h = $('hint'); h.classList.add('show'); setTimeout(function () { h.classList.remove('show'); }, 7000); }

/* старт: Земля, видна освещённая сторона */
updateBodies();
(function () {
  var b = bodies.earth, d = viewDistance(b);
  var dir = b.sunDir.clone().multiplyScalar(0.85).add(new V3(0.35, 0.28, 0.1)).normalize();
  S.rel.copy(dir).multiplyScalar(d * 1.05);
})();
renderInfo('earth'); updateChips();
Promise.all([texA.ready, texB.ready]).then(function () {
  updateBodies(); updateCamera(0.016, performance.now());
  try { renderer.compile(scene, camera); } catch (e) {}
  requestAnimationFrame(function (t) { last = t; frame(t); });
});
})();

</script>
</body>
